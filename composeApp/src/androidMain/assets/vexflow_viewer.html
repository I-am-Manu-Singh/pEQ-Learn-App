<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            background-color: #0c0f12;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 16px;
            overflow-x: auto;
        }
        #output {
            display: inline-block;
            min-width: 100%;
        }
    </style>
    <script src="file:///android_asset/vexflow.js"></script>
</head>
<body>
    <div id="output"></div>
    <script>
        function midiToVexKey(midiNote) {
            const notes = ["c", "c#", "d", "d#", "e", "f", "f#", "g", "g#", "a", "a#", "b"];
            const noteIndex = midiNote % 12;
            const octave = Math.floor(midiNote / 12) - 1;
            return notes[noteIndex] + "/" + octave;
        }

        let playheadLine = null;

        window.drawScoreBase64 = function(base64Str) {
            try {
                playheadLine = null;
                const jsonStr = decodeURIComponent(escape(window.atob(base64Str)));
                window.drawScore(jsonStr);
            } catch (e) {
                document.getElementById("output").innerHTML = "Base64 Decode Error: " + e.message;
            }
        };

        window.setPlayhead = function(measure, offset) {
            try {
                const container = document.getElementById("output");
                const svg = container.querySelector("svg");
                if (!svg) return;
                
                const measureWidth = 320;
                const startX = 50 + (measure * measureWidth) + (offset * measureWidth);
                
                if (!playheadLine || !playheadLine.parentNode) {
                    playheadLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    playheadLine.setAttribute("y1", "20");
                    playheadLine.setAttribute("y2", "300");
                    playheadLine.setAttribute("stroke", "#FF4081");
                    playheadLine.setAttribute("stroke-width", "3");
                    playheadLine.setAttribute("opacity", "0.9");
                    svg.appendChild(playheadLine);
                }
                playheadLine.setAttribute("x1", startX);
                playheadLine.setAttribute("x2", startX);
                
                // Auto scroll with smooth behavior centered on playhead
                const targetScroll = startX - (window.innerWidth / 2);
                window.scrollTo({ left: Math.max(0, targetScroll), behavior: 'auto' });
            } catch (e) {
                console.error("setPlayhead Error: " + e.message);
            }
        };

        window.drawScore = function(scoreJsonStr) {
            try {
                const score = JSON.parse(scoreJsonStr);
                const container = document.getElementById("output");
                container.innerHTML = "";

                const { Renderer, Stave, StaveNote, Voice, Formatter } = Vex.Flow;
                
                const measureWidth = 320;
                const totalWidth = score.measures.length * measureWidth + 80;
                
                const renderer = new Renderer(container, Renderer.Backends.SVG);
                renderer.resize(totalWidth, 320);
                const context = renderer.getContext();
                context.setFont("Arial", 10, "").setBackgroundFillStyle("#0c0f12");

                for (let mIdx = 0; mIdx < score.measures.length; mIdx++) {
                    const measure = score.measures[mIdx];
                    const x = 50 + mIdx * measureWidth;

                    const trebleStave = new Stave(x, 40, measureWidth);
                    if (mIdx === 0) {
                        trebleStave.addClef("treble").addTimeSignature(score.timeSignature || "4/4");
                    }
                    trebleStave.setContext(context).draw();

                    const bassStave = new Stave(x, 160, measureWidth);
                    if (mIdx === 0) {
                        bassStave.addClef("bass").addTimeSignature(score.timeSignature || "4/4");
                    }
                    bassStave.setContext(context).draw();

                    const trebleNotes = [];
                    const bassNotes = [];

                    const posGroups = {};
                    measure.notes.forEach(note => {
                        const pos = note.position;
                        if (!posGroups[pos]) posGroups[pos] = [];
                        posGroups[pos].push(note);
                    });

                    const sortedPos = Object.keys(posGroups).map(Number).sort((a,b) => a-b);

                    sortedPos.forEach(pos => {
                        const notesAtPos = posGroups[pos];
                        const trebleKeys = [];
                        const bassKeys = [];
                        let durationCode = "q";
                        
                        const firstNote = notesAtPos[0];
                        if (firstNote.duration <= 0.25) durationCode = "16";
                        else if (firstNote.duration <= 0.5) durationCode = "8";
                        else if (firstNote.duration <= 1.0) durationCode = "q";
                        else if (firstNote.duration <= 2.0) durationCode = "h";
                        else durationCode = "w";

                        notesAtPos.forEach(note => {
                            const key = midiToVexKey(note.midiNote);
                            if (note.midiNote >= 60) {
                                trebleKeys.push(key);
                            } else {
                                bassKeys.push(key);
                            }
                        });

                        if (trebleKeys.length > 0) {
                            trebleNotes.push(new StaveNote({ keys: trebleKeys, duration: durationCode }));
                        }
                        if (bassKeys.length > 0) {
                            bassNotes.push(new StaveNote({ keys: bassKeys, duration: durationCode }));
                        }
                    });

                    if (trebleNotes.length === 0) {
                        trebleNotes.push(new StaveNote({ keys: ["b/4/r"], duration: "w" }));
                    }
                    if (bassNotes.length === 0) {
                        bassNotes.push(new StaveNote({ keys: ["d/3/r"], duration: "w" }));
                    }

                    const voiceTreble = new Voice({ num_beats: 4, beat_value: 4 }).setMode(Voice.Mode.SOFT);
                    voiceTreble.addTickables(trebleNotes);
                    
                    const voiceBass = new Voice({ num_beats: 4, beat_value: 4 }).setMode(Voice.Mode.SOFT);
                    voiceBass.addTickables(bassNotes);

                    new Formatter().joinVoices([voiceTreble]).format([voiceTreble], measureWidth - 40);
                    new Formatter().joinVoices([voiceBass]).format([voiceBass], measureWidth - 40);

                    voiceTreble.draw(context, trebleStave);
                    voiceBass.draw(context, bassStave);
                }
            } catch (e) {
                document.getElementById("output").innerHTML = "Error drawing score: " + e.message;
            }
        };
    </script>
</body>
</html>
